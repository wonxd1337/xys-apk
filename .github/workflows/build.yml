name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder android (jika belum ada)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.tew --project-name deoxys_dashboard --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Izin internet, HTTP, dan nama aplikasi
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          grep -q 'usesCleartextTraffic' $M || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="Deoxys"#' $M

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release > build.log 2>&1 || {
            echo "=== RINGKASAN ERROR ==="
            grep -n -E "Error|error:|Exception|lib/" build.log | head -40
            echo "=== 60 BARIS TERAKHIR ==="
            tail -60 build.log
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: deoxys-apk
          path: build/app/outputs/flutter-apk/app-release.apk
